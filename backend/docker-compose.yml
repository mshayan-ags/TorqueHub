version: "3.9"

services:
  api:
    build:
      context: .
      target: release
    image: torquehub:local
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: production
      # Values are supplied via .env.docker (gitignored) so no secret is
      # ever hardcoded here.
      AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
    env_file:
      - .env.docker
    restart: unless-stopped
