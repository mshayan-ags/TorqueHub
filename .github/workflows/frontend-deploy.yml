name: Build and Deploy Frontend Container


# Relocated from Frontend/deploy.yml, which sat outside .github/workflows/
# and therefore never actually ran as a workflow. `context`/`file` are fixed
# to point at the Frontend/ subfolder — GitHub Actions always checks out to
# the repo root regardless of where the workflow file itself lives, so the
# original `context: .` would have built from the wrong directory the first
# time this ever ran.

on:
  push:
    branches: [main, master]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.AZURE_REGISTRY_URL }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_URL }}/frontend:latest
            ${{ secrets.AZURE_REGISTRY_URL }}/frontend:${{ github.sha }}

      - name: Build succeeded
        run: |
          echo "Docker image built and pushed successfully."
          echo "Image: ${{ secrets.AZURE_REGISTRY_URL }}/frontend:latest"
